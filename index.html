<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanging Card Animation</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #312e81);
        overflow: hidden;
      }

      .container {
        text-align: center;
      }

      .tag {
        color: #c4b5fd;
        font-size: 12px;
        letter-spacing: 4px;
        margin-bottom: 25px;
      }

      h2 {
        width: 260px;
        min-height: 150px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;

        background: linear-gradient(145deg, #818cf8, #6366f1);
        color: white;
        border: 1px solid #ffffff50;
        border-radius: 20px;
        box-shadow: 0 20px 50px #00000040;

        transform-origin: top center;
        animation: hang 2s ease-in-out infinite alternate;
        transition: box-shadow 0.3s;
      }

      h2 span {
        font-size: 14px;
        font-weight: 400;
        color: #e0e7ff;
      }

      h2:hover {
        box-shadow: 0 25px 60px #818cf155;
        animation-play-state: paused;
        transform: scale(1.05);
      }

      @keyframes hang {
        0% {
          transform: rotate(-4deg);
        }

        50% {
          transform: rotate(4deg);
        }

        100% {
          transform: rotate(-4deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h2 {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p class="tag">CSS ANIMATION</p>

      <h2>
        ✨ Hanging Card
        <span>Made with HTML & CSS</span>
      </h2>
    </div>
  </body>
</html>
